pipeline:
  load_mode: append
  load_only: false
  skip_duplicate_batch: true
  chunk_size: 5000
  auto_resume: true
  fresh: false
  run_id: null
  data_dir: data
  save_raw_parquet: true
  db_max_retries: 3

incremental:
  lookback_years: 3

backfill:
  raw_payload:
    enabled: false
    only_null: true
    tables:
      - raw_worldbank_indicators
      - raw_worldbank_countries
      - raw_worldbank_indicator_metadata
    exclude_meta_columns:
      - raw_payload
      - extracted_at
      - batch_id
      - source_endpoint
      - ingestion_run_id
      - ingested_at
  parquet_legacy:
    auto_populate_raw_payload: true
